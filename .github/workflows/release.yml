name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
      - name: Build four strict archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          module="$(go list -m)"
          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          tools_dir="${RUNNER_TEMP}/llamalc-tools"
          GOBIN="${tools_dir}" go install github.com/tc-hib/go-winres@v0.3.3
          winres="${tools_dir}/go-winres"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            suffix=""
            extension="tar.gz"
            if [ "${goos}" = windows ]; then suffix=".exe"; extension="zip"; fi
            package="$(mktemp -d)"
            mkdir -p "${package}/LlamaLc/bin"
            for program in llamalc llamaup; do
              GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build -trimpath \
                -ldflags "-s -w -X ${module}/internal/version.Version=${VERSION} -X ${module}/internal/version.Commit=${COMMIT} -X ${module}/internal/version.BuildDate=${build_date}" \
                -o "${package}/LlamaLc/bin/${program}${suffix}" "./cmd/${program}"
              grep -aFq "${VERSION}" "${package}/LlamaLc/bin/${program}${suffix}"
              if [ "${goos}" = windows ]; then
                "${winres}" patch --in build/windows/manifest.json --no-backup "${package}/LlamaLc/bin/${program}${suffix}"
                grep -aFq 'requestedExecutionLevel level="asInvoker" uiAccess="false"' "${package}/LlamaLc/bin/${program}${suffix}"
              fi
            done
            archive="dist/llamalc-${goos}-${goarch}-${VERSION}.${extension}"
            if [ "${goos}" = windows ]; then
              (cd "${package}" && zip -q -r "${GITHUB_WORKSPACE}/${archive}" LlamaLc)
              test "$(unzip -Z1 "${archive}" | grep -v '/$' | sort)" = "$(printf '%s\n' 'LlamaLc/bin/llamalc.exe' 'LlamaLc/bin/llamaup.exe' | sort)"
            else
              tar -C "${package}" -czf "${archive}" LlamaLc
              test "$(tar -tzf "${archive}" | grep -v '/$' | sort)" = "$(printf '%s\n' 'LlamaLc/bin/llamalc' 'LlamaLc/bin/llamaup' | sort)"
            fi
          done
          (cd dist && sha256sum llamalc-* > SHA256SUMS.txt)
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/llamalc-* dist/SHA256SUMS.txt --generate-notes --verify-tag
