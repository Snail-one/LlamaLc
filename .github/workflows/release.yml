name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build and package Windows amd64
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          ENTRY_DIR="$(find cmd -mindepth 1 -maxdepth 1 -type d -print -quit)"
          APP_NAME="$(basename "${ENTRY_DIR}")"
          MODULE_PATH="$(go list -m)"
          BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p dist/package/bin
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X ${MODULE_PATH}/internal/version.Version=${VERSION} -X ${MODULE_PATH}/internal/version.Commit=${COMMIT} -X ${MODULE_PATH}/internal/version.BuildDate=${BUILD_DATE}" \
            -o "dist/package/bin/${APP_NAME}.exe" \
            "./${ENTRY_DIR}"
          cp README.md launcher.example.json dist/package/
          cd dist/package
          zip -r "../${APP_NAME}-${VERSION}-windows-amd64.zip" \
            bin README.md launcher.example.json
          cd ..
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.zip
          dist/SHA256SUMS.txt
          --generate-notes
          --verify-tag
