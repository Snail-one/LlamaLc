name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build and package Windows amd64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package/bin
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X github.com/joker/llama-launcher/internal/launcher.Version=${VERSION}" \
            -o dist/package/bin/llama-launcher.exe \
            ./cmd/llama-launcher
          cp README.md launcher.example.json dist/package/
          cd dist/package
          zip -r ../llama-launcher-${VERSION}-windows-amd64.zip \
            bin README.md launcher.example.json
          cd ..
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.zip
          dist/SHA256SUMS.txt
          --generate-notes
          --verify-tag
