name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Build four launcher archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          module="$(go list -m)"
          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            suffix=""
            archive_ext="tar.gz"
            if [ "${goos}" = windows ]; then
              suffix=".exe"
              archive_ext="zip"
            fi
            package="$(mktemp -d)"
            mkdir -p "${package}/llama.cpp/bin"
            binary="${package}/llama.cpp/bin/llama-launcher${suffix}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X ${module}/internal/version.Version=${VERSION} -X ${module}/internal/version.Commit=${COMMIT} -X ${module}/internal/version.BuildDate=${build_date}" \
              -o "${binary}" ./cmd/llama-launcher
            grep -aFq "${VERSION}" "${binary}"
            archive="dist/llama-launcher-${VERSION}-${goos}-${goarch}.${archive_ext}"
            if [ "${goos}" = windows ]; then
              (cd "${package}" && zip -q -r "${GITHUB_WORKSPACE}/${archive}" llama.cpp)
              test "$(unzip -Z1 "${archive}" | grep -v '/$')" = "llama.cpp/bin/llama-launcher.exe"
            else
              tar -C "${package}" -czf "${archive}" llama.cpp
              test "$(tar -tzf "${archive}" | grep -v '/$')" = "llama.cpp/bin/llama-launcher"
            fi
            rm -rf "${package}"
          done
          (cd dist && sha256sum llama-launcher-* > SHA256SUMS.txt)
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/llama-launcher-* \
            dist/SHA256SUMS.txt \
            --generate-notes \
            --verify-tag
